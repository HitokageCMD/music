[project]
name = "tunebox"
version = "0.1.0"
description = "Self-hosted personal music player"
requires-python = ">=3.13"
# Pure Python only — no compiled dependencies. The server is stdlib http.server,
# so the whole runtime is these three plus their pure-Python deps. That's what
# lets it run inside an Android APK (Chaquopy) and on the phone directly.
dependencies = [
    "yt-dlp>=2025.1.15",
    "ytmusicapi>=1.9",
    "httpx>=0.28",
]

[tool.uv]
package = false
